name: Sync Notion Data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"

concurrency:
  group: sync-notion-data
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Notion secrets are set
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: |
          if [ -z "${NOTION_TOKEN}" ]; then
            echo "::error::Secret NOTION_TOKEN is empty. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          if [ -z "${NOTION_DATABASE_ID}" ]; then
            echo "::error::Secret NOTION_DATABASE_ID is empty. Use your Notion database UUID (from the database URL or Share → Copy link)."
            exit 1
          fi
          echo "Notion secrets are present (values not shown)."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Sync data from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: npm run sync:notion

      - name: Commit and push if updates.json changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/updates.json
          if git diff --cached --quiet; then
            echo "No file changes — nothing to commit (e.g. zero Notion rows or sync left updates.json unchanged)."
            exit 0
          fi
          git commit -m "chore: sync Notion data to public/updates.json"
          git push
